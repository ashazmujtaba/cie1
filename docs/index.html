<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <!-- Links to your external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="menu-container">
    <h1>Menu Items</h1>

    <div class="menu-item">
        <div class="item-details">
            <div class="item-header">
                <span class="item-id">#1</span>
                <span class="item-name">Burger</span>
            </div>
            <span class="item-category">Fast Food</span>
        </div>
        <div class="item-price">$5.99</div>
    </div>

    <div class="menu-item">
        <div class="item-details">
            <div class="item-header">
                <span class="item-id">#2</span>
                <span class="item-name">Caesar Salad</span>
            </div>
            <span class="item-category">Starters</span>
        </div>
        <div class="item-price">$7.50</div>
    </div>

    <div class="menu-item">
        <div class="item-details">
            <div class="item-header">
                <span class="item-id">#3</span>
                <span class="item-name">Iced Coffee</span>
            </div>
            <span class="item-category">Beverages</span>
        </div>
        <div class="item-price">$3.25</div>
    </div>
</div>

</body>
</html>
